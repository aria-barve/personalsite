<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Case Study Portfolio — </title>
<!-- <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"> -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #111;
    font-family: 'EB Garamond', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 64px 32px 96px;
  }

  /* Header */
  header {
    max-width: 960px;
    margin: 0 auto 52px;
    border-bottom: 1px solid #111;
    padding-bottom: 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 48px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 13px;
    color: #888;
    letter-spacing: 0.3px;
  }

  /* Grid */
  .grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  /* Card */
  .post-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 2px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    aspect-ratio: 1 / 1;
    position: relative;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .post-card:hover {
    border-color: #111;
    box-shadow: 4px 4px 0px #111;
  }

  /* Thumbnail */
  .post-card .thumb {
    width: 100%;
    height: 62%;
    object-fit: cover;
    display: block;
    background: #f5f5f5;
  }

  .post-card .thumb-placeholder {
    width: 100%;
    height: 62%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #ccc;
  }

  /* Card body */
  .post-card .card-body {
    padding: 16px 18px 18px;
    height: 38%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .post-card .card-tag {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .post-card .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.25;
    color: #111;
    flex: 1;
  }

  .post-card .card-meta {
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Portfolio</h1>
</header>

<div class="grid">

  <!-- ============================================================
       HOW TO ADD A NEW POST:
       Copy one <a class="post-card"> block below, paste it into
       the grid, and update:
         href        → your new HTML filename (e.g. "spotify.html")
         card-tag    → topic (e.g. "Product Management")
         card-title  → your post title
         card-meta   → date or subtitle
         thumb src   → path to your preview image
       If you don't have an image yet, swap the <img> for the
       <div class="thumb-placeholder"> block shown in the comments.
  =============================================================== -->

  <!-- POST 1 -->
  <a class="post-card" href="netflix.html">
    <!-- If you have a preview image: -->
    <img class="thumb" src="netflixLogo.jpg" alt="Adding Social Features to Netflix">
    <!-- If you don't have an image yet, delete the <img> above and use this instead:
    <div class="thumb-placeholder">📺</div>
    -->
    <div class="card-body">
      <div>
        <div class="card-tag">Product Management</div>
        <div class="card-title">Adding Social Features to Netflix</div>
      </div>
      <div class="card-meta">05-19-2026 &nbsp;</div>
    </div>
  </a>

  <!-- POST 2 — copy this block for every new post-->
  <a class="post-card" href="pinterest.html">
    <!-- If you have a preview image: -->
    <img class="thumb" src="pinterestLogo.jpg" alt="Expanding Pinterest's User Base">
    <!-- If you don't have an image yet, delete the <img> above and use this instead:
    <div class="thumb-placeholder">📺</div>
    -->
    <div class="card-body">
      <div>
        <div class="card-tag">Product Management</div>
        <div class="card-title">Expanding Pinterest's User Base</div>
      </div>
      <div class="card-meta">05-23-2026 &nbsp;</div>
    </div>
  </a>

  <!-- POST 3 — copy this block for every new post-->
  <a class="post-card" href="audible.html">
    <!-- If you have a preview image: -->
    <img class="thumb" src="audibleLogo.jpeg" alt="Increasing Audible's Customer Engagement">
    <!-- If you don't have an image yet, delete the <img> above and use this instead:
    <div class="thumb-placeholder">📺</div>
    -->
    <div class="card-body">
      <div>
        <div class="card-tag">Product Management</div>
        <div class="card-title">Increasing Audible's Customer Engagement</div>
      </div>
      <div class="card-meta">06-09-2026 &nbsp;</div>
    </div>
  </a>
  

</div>

</body>
</html>
